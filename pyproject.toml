[project]
name = "quarterly-pulse"
version = "0.1.0"
description = "AI agent CLI that populates Markdown quarterly activity and impact logs from GitHub, LinkedIn, and local contributor documents filtered by a start date."
readme = "README.md"
authors = [
    { name = "Vincent Caldeira", email = "vcaldeir@redhat.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=1.10.0",
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.12.5",
]

[project.scripts]
quarterly-pulse = "quarterly_pulse.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
